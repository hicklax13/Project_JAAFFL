name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,data,engine]'
      - name: Lint
        run: ruff check . ../scripts
      - name: Format check
        run: ruff format --check . ../scripts
      - name: Test
        run: pytest -q
      - name: Schema parity (E5) — regenerate and diff
        run: |
          python ../scripts/export_schemas.py
          git diff --exit-code ../packages/shared/schemas

  js:
    name: Web + Extension (TypeScript, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # package.json declares `engines.node: ">=22"`, so CI proves BOTH ends of that
      # claim: 22 is the supported floor, 24 is what the owner's machine actually runs.
      # Testing only one meant the other was an untested assertion.
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint + prettier)
        run: pnpm lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
      - name: Extension build (manifest emit sanity)
        run: pnpm --filter @jaaffl/extension build
      - name: Web production build + Next-managed file drift guard
        # `next build` was never exercised in CI, so a non-canonical committed
        # tsconfig.json went unnoticed: Next patched it mid-build and the build
        # died at "Collecting page data" (PageNotFoundError /_document). The
        # git diff leg is the real guard — if Next had to rewrite either file,
        # the committed copy has drifted out of Next's canonical form again.
        run: |
          pnpm --filter @jaaffl/web build
          git diff --exit-code apps/web/tsconfig.json apps/web/next-env.d.ts

  e4-playwright:
    name: E4 DOM-probe (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          # Matches .nvmrc — the version the owner's machine runs. The js job's
          # matrix is what proves the >=22 floor.
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @jaaffl/extension exec playwright install --with-deps chromium
      - name: E4 DOM-probe spec
        run: pnpm --filter @jaaffl/extension test:e2e
