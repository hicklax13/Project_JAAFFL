name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,data,engine]'
      - name: Lint
        run: ruff check . ../scripts
      - name: Format check
        run: ruff format --check . ../scripts
      - name: Test
        run: pytest -q
      - name: Schema parity (E5) — regenerate and diff
        run: |
          python ../scripts/export_schemas.py
          git diff --exit-code ../packages/shared/schemas

  js:
    name: Web + Extension (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
      - name: Extension build (manifest emit sanity)
        run: pnpm --filter @jaaffl/extension build

  e4-playwright:
    name: E4 DOM-probe (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @jaaffl/extension exec playwright install --with-deps chromium
      - name: E4 DOM-probe spec
        run: pnpm --filter @jaaffl/extension test:e2e
